<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AWS構成・料金比較</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="ec2-instance-table.css"></head>
<body>
  <header><div><span class="eyebrow">AWS ARCHITECTURE ESTIMATOR</span><h1>AWS構成・料金比較</h1><p>構成案を複製して、違いと月額をひとつの画面で比較。</p></div><div class="header-actions"><button id="new-project">新規Project</button><button id="restore-open">JSONを復元</button><button id="json-export">Project JSON</button><button id="csv-export">CSV</button><button id="pdf-export" class="primary">PDF + JSON</button></div></header>
  <main><section class="project-settings"><label>Project名<input id="project-name"></label><label>Region<select id="project-region"><option value="ap-northeast-1">Tokyo · ap-northeast-1</option><option value="ap-northeast-3">Osaka · ap-northeast-3</option><option value="us-east-1">N. Virginia · us-east-1</option><option value="us-east-2">Ohio · us-east-2</option><option value="us-west-1">N. California · us-west-1</option><option value="us-west-2">Oregon · us-west-2</option></select></label><label>共通 月間時間<input id="project-hours" type="number" min="0" step="any"></label></section><div class="meta"><span>USD · On-Demand · 税別 · 無料枠・割引なし</span><span id="price-meta" role="status">Price Dataを確認中…</span><button id="check-price">更新確認</button></div><p id="app-message" role="status" aria-live="polite"></p><section id="workspace" aria-label="構成案の比較"></section></main>
  <dialog id="catalog-modal"><div class="dialog-heading"><h2>サービスを追加・置換</h2><button data-close="catalog-modal" aria-label="サービス選択を閉じる">×</button></div><p id="catalog-target"></p><label>サービス検索<input id="catalog-search" type="search" placeholder="サービス名を検索"></label><label>Price source絞り込み<select id="catalog-filter"><option value="">すべて</option></select></label><div id="catalog-list"></div></dialog>
  <dialog id="service-drawer" class="drawer"><div class="dialog-heading"><h2 id="drawer-title">サービスを編集</h2><button data-close="service-drawer" aria-label="編集を閉じる">×</button></div><div id="drawer-content"></div></dialog>
  <dialog id="restore-modal"><div class="dialog-heading"><h2>Project JSONを復元</h2><button data-close="restore-modal" aria-label="復元を閉じる">×</button></div><p>JSONを貼り付けて復元します。</p><label>Project JSON<textarea id="restore-text" rows="14"></textarea></label><button id="restore-submit" class="primary">復元する</button><div id="restore-report" role="status"></div></dialog>
  <script type="module" src="src/app/app.js"></script>
  <script type="module" src="src/app/drawer-state-sync.js"></script>
  <script type="module" src="src/app/ec2-instance-table.js"></script>
</body></html>
