<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AWS Pricing Workspace Mock</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <div class="eyebrow">AWSPricingCalculator_forTAE</div>
      <div class="title-row">
        <h1>Web基盤 更改案</h1>
        <span class="badge">UI MOCK</span>
      </div>
      <div class="meta">Region: ap-northeast-1 · Price list: 2026-10-03 · On-Demand</div>
    </div>
    <div class="header-actions">
      <button class="btn ghost">JSON</button>
      <button class="btn ghost">CSV</button>
      <button class="btn ghost">PDF</button>
      <button class="btn primary" id="recalcAll">↻ 全体を再計算</button>
    </div>
  </header>

  <main class="workspace">
    <section class="system-bar card">
      <div>
        <div class="eyebrow dark">PROJECT SERVICES</div>
        <strong>このシステムで利用するサービス</strong>
        <div class="service-chips" id="serviceChips"></div>
      </div>
      <button class="btn ghost" id="manageServices">サービス構成を編集</button>
    </section>

    <section class="toolbar card">
      <div>
        <strong>構成案を横並びで比較</strong>
        <p>全案で同じサービス構成を共有し、各サービスのスペックや利用量だけを変えて比較します。</p>
      </div>
      <div class="toolbar-actions">
        <label class="baseline-label">差分基準
          <select id="baselineSelect"></select>
        </label>
        <button class="btn primary" id="addPlan">＋ 新しい案</button>
      </div>
    </section>

    <section class="comparison-shell card">
      <div class="comparison-grid" id="comparisonGrid"></div>
    </section>
  </main>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-header">
      <div>
        <div class="eyebrow" id="drawerPlan">Plan</div>
        <h2 id="drawerTitle">Service</h2>
      </div>
      <button class="icon-btn" id="closeDrawer" aria-label="閉じる">×</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-footer">
      <div>
        <span>このサービス</span>
        <strong id="drawerServicePrice">¥0 /月</strong>
      </div>
      <div>
        <span>構成案合計</span>
        <strong id="drawerPlanTotal">¥0 /月</strong>
      </div>
    </div>
  </aside>

  <div class="modal" id="serviceModal" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <div class="eyebrow dark">PROJECT SERVICES</div>
          <h2>サービス構成</h2>
          <p>ここでの変更は、すべての構成案に共通して反映されます。</p>
        </div>
        <button class="icon-btn" id="closeServiceModal" aria-label="閉じる">×</button>
      </div>
      <div class="service-picker" id="servicePicker"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="cancelServiceModal">キャンセル</button>
        <button class="btn primary" id="applyServices">全構成案に適用</button>
      </div>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>

  <script src="app.js"></script>
</body>
</html>
