name: EC2 Pricing Meter Discovery
on:
  workflow_dispatch:
  push:
    branches: [reonboard/ec2-official-input-parity]
    paths:
      - .github/workflows/ec2-meter-discovery.yml
      - tools/discover-ec2-meters.js
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Discover Tokyo network and CloudWatch price meters
        env:
          AWS_PRICING_WRITE_FIXTURES: 'true'
        run: node --max-old-space-size=8192 tools/discover-ec2-meters.js ap-northeast-1 ec2-meter-evidence.json
      - name: Commit verified pricing fixtures on re-onboarding branch only
        if: github.ref == 'refs/heads/reonboard/ec2-official-input-parity'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/fixtures/aws/AWSDataTransfer.json tests/fixtures/aws/AmazonCloudWatch.supplement.json
          if ! git diff --cached --quiet; then
            git commit -m 'test(ec2): refresh AWS-sourced Tokyo pricing fixtures'
            git pull --rebase origin reonboard/ec2-official-input-parity
            git push origin HEAD:reonboard/ec2-official-input-parity
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ec2-meter-evidence
          path: ec2-meter-evidence.json
          if-no-files-found: warn
