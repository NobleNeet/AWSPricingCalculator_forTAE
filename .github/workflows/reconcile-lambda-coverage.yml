name: Reconcile Lambda coverage

on:
  push:
    branches:
      - fix/lambda-coverage-and-golden
    paths:
      - tools/reconcile-lambda-coverage.js
      - .github/workflows/reconcile-lambda-coverage.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lambda-coverage-and-golden
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile implemented Lambda meters
        run: |
          if [ -f tools/reconcile-lambda-coverage.js ]; then
            node tools/reconcile-lambda-coverage.js
          fi
      - name: Commit coverage update
        run: |
          if git diff --quiet -- services/lambda/coverage.json; then
            echo 'No coverage changes.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/lambda/coverage.json
          git commit -m 'Align Lambda coverage with implemented meters'
          git push origin HEAD:fix/lambda-coverage-and-golden
