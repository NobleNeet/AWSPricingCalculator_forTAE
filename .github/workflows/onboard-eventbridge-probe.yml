name: EventBridge onboarding probe
on:
  pull_request:
  push:
    branches: [onboard/eventbridge]
    paths:
      - '.github/workflows/onboard-eventbridge-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect AWSEvents Public Price List for supported project regions
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          const regions = ['ap-northeast-1','ap-northeast-3','us-east-1','us-east-2','us-west-1','us-west-2'];
          for (const region of regions) {
            const url = `https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AWSEvents/current/${region}/index.json`;
            const response = await fetch(url);
            if (!response.ok) throw new Error(`${region}: HTTP ${response.status}`);
            const raw = await response.json();
            const rows = [];
            for (const [sku, product] of Object.entries(raw.products ?? {})) {
              const a = product.attributes ?? {};
              if (a.regionCode !== region) continue;
              const terms = Object.values(raw.terms?.OnDemand?.[sku] ?? {});
              for (const term of terms) for (const d of Object.values(term.priceDimensions ?? {})) {
                rows.push({
                  sku, productFamily: product.productFamily ?? '', usageType: a.usagetype ?? '',
                  operation: a.operation ?? '', eventType: a.eventType ?? '', request: a.request ?? '',
                  invocation: a.invocation ?? '', eventsV2: a['eventsv2-meteringdimension'] ?? '',
                  unit: d.unit, beginRange: d.beginRange, endRange: d.endRange, price: d.pricePerUnit?.USD
                });
              }
            }
            rows.sort((a,b)=>a.usageType.localeCompare(b.usageType)||a.operation.localeCompare(b.operation)||a.beginRange.localeCompare(b.beginRange));
            console.log('REGION_SUMMARY '+JSON.stringify({region,publicationDate:raw.publicationDate,version:raw.version,rows}));
          }
          NODE
