name: Recover superseded estimate-quality publication
on:
  push:
    branches: [main]
    paths: ['.github/workflows/price-update-recovery.yml']
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  cancel-known-invalid-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Only explicitly recorded superseded attempts may be cancelled.
            // Replacement candidates still pass all existing publication gates.
            const targets = [
              { run_id: 38129557639, sha: '9764b6f08efb885e84e360f8bf5945e61d63ac01',
                reason: 'Invalid drift checks omitted required parent components.' },
              { run_id: 38134317362, sha: '358d307a953fa5db184d9dd9c0d09fba0e95eb89',
                reason: 'Superseded by equivalent bounded-cache drift checks; avoid repeated large candidate scans.' }
            ];
            for (const target of targets) {
              const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: target.run_id });
              if (run.head_sha !== target.sha || run.path !== '.github/workflows/price-update.yml') {
                throw new Error('Recovery target does not match the recorded workflow and commit.');
              }
              if (run.status === 'completed') {
                core.info(`Target ${target.run_id} already completed: ${run.conclusion}`);
                continue;
              }
              await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: target.run_id });
              core.info(`Cancelled superseded candidate ${target.run_id}: ${target.reason}`);
            }
