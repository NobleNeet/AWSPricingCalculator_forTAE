name: Scheduled Price Update
on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'pricing/normalization/**'
      - 'pricing/limitations.json'
      - 'pricing/sources.json'
      - 'src/pricing/**'
      - 'tools/pricing-cli/**'
      - 'tools/price-update.js'
      - 'tools/price-update-matrix.js'
      - 'tools/price-source-batches.js'
      - 'tools/golden-evidence.js'
      - 'tools/schema.js'
      - 'schemas/**'
      - '.github/workflows/price-validation.yml'
      - 'tools/semantic-batch-plan.js'
      - 'tools/merge-semantic-batches.js'
      - 'tools/drift-batch-plan.js'
      - 'tools/drift-batch-run.js'
      - 'tools/merge-drift-batches.js'
      - '.github/workflows/price-update.yml'
  schedule:
    - cron: '23 2 * * *'
  # Also dispatched explicitly by onboarding-promotion because GITHUB_TOKEN pushes do not chain workflows.
  workflow_dispatch:
    inputs:
      validation_scope_service_ids:
        description: 'Comma-separated internal service ids for onboarding-scoped heavy validation. Empty uses normal incremental validation.'
        required: false
        type: string
      validation_only:
        description: 'Validate and build a candidate without publication or deployment.'
        type: boolean
        default: false
      refresh_requested_sources:
        description: 'Validation-only: download pinned sources for the explicit service scope even if unchanged.'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pricing-update
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PRICE_UPDATE_SCOPE_SERVICE_IDS: ${{ inputs.validation_scope_service_ids || '' }}
      PRICE_UPDATE_VALIDATION_ONLY: ${{ inputs.validation_only || false }}
      PRICE_UPDATE_REFRESH_REQUESTED_SOURCES: ${{ inputs.refresh_requested_sources || false }}
    outputs:
      needs_update: ${{ steps.check.outputs.needs_update }}
      source_matrix: ${{ steps.check.outputs.source_matrix }}
      source_count: ${{ steps.check.outputs.source_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Pin AWS versions and determine refresh scope
        id: check
        run: node tools/price-update-matrix.js check
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.needs_update == 'true'
        with:
          name: price-source-plan
          path: |
            .work/update/source-metadata.json
            .work/update/source-plan.json
            .work/update/prepare-state.json
            .work/update/reports
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.needs_update != 'true'
        with:
          name: price-analysis
          path: .work/update/reports
          include-hidden-files: true

  download-source:
    needs: check
    if: needs.check.outputs.needs_update == 'true' && needs.check.outputs.source_count != '0'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.check.outputs.source_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_BATCH_ID: ${{ matrix.source_id }}
      PRICE_NORMALIZE_CONCURRENCY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: price-source-plan
          path: .work/update
      - name: Download pinned source and normalize independently
        run: node tools/price-source-batches.js .work/update "$SOURCE_BATCH_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: price-source-${{ matrix.source_id }}
          path: |
            .work/update/candidate/sources
            .work/update/candidate/indexes
            .work/update/candidate/chunks
            .work/update/raw
            .work/update/source-results
          include-hidden-files: true
          compression-level: 1
          if-no-files-found: error

  prepare:
    needs: [check, download-source]
    if: always() && needs.check.outputs.needs_update == 'true' && (needs.download-source.result == 'success' || (needs.check.outputs.source_count == '0' && needs.download-source.result == 'skipped'))
    runs-on: ubuntu-latest
    outputs:
      needs_update: ${{ steps.prepare.outputs.needs_update }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: price-source-plan
          path: .work/update
      - uses: actions/download-artifact@v4
        if: needs.check.outputs.source_count != '0'
        with:
          pattern: price-source-0*
          path: .work/update
          merge-multiple: true
      - name: Verify source completeness and assemble immutable candidate
        id: prepare
        run: node tools/price-update-matrix.js assemble
      - uses: actions/upload-artifact@v4
        with:
          name: price-update-workspace
          path: |
            .work/update/candidate
            .work/update/golden-raw
            .work/update/reports
            .work/update/source-metadata.json
            .work/update/prepare-state.json
          include-hidden-files: true
          compression-level: 1

  semantic-merge:
    needs: prepare
    if: needs.prepare.outputs.needs_update == 'true'
    uses: ./.github/workflows/price-validation.yml
    with:
      directory: .work/update/candidate
      workspace_artifact: price-update-workspace
      artifact_prefix: semantic
      prepared_update: true

  golden:
    needs: prepare
    if: needs.prepare.outputs.needs_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: price-update-workspace
          path: .work/update
      - name: Run golden validation independently
        shell: bash
        run: |
          set +e
          node tools/pricing-cli/cli.js run-golden \
            --input .work/update/candidate \
            --raw .work/update/golden-raw \
            --output .work/update/run-golden.json
          rc=$?
          if [[ $rc -eq 2 ]]; then
            exit 2
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: golden-report
          path: .work/update/run-golden.json
          if-no-files-found: error

  drift-plan:
    needs: [prepare, semantic-merge]
    if: needs.prepare.outputs.needs_update == 'true' && needs.semantic-merge.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      batch_count: ${{ steps.plan.outputs.batch_count }}
    env:
      PRICE_DRIFT_PLAN_CONCURRENCY: '2'
      PRICE_DRIFT_WORKFLOW_BATCH_CASES: '10000'
      PRICE_DRIFT_MAX_WORKFLOW_BATCHES: '240'
      PRICE_DRIFT_WORKFLOW_WORKERS: '8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: price-update-workspace
          path: .work/update
      - uses: actions/download-artifact@v4
        with:
          name: semantic-report
          path: .work/update/reports
      - name: Plan drift workflow batches
        id: plan
        shell: bash
        run: |
          node tools/drift-batch-plan.js .work/update .work/update/drift-plan.json
          node --input-type=module - <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile } from 'node:fs/promises';
          const plan = JSON.parse(await readFile('.work/update/drift-plan.json', 'utf8'));
          console.log(`matrix=${JSON.stringify(plan.matrix)}`);
          console.log(`batch_count=${plan.summary.batches}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: drift-plan
          path: .work/update/drift-plan.json
          if-no-files-found: error

  drift:
    needs: [prepare, drift-plan]
    if: needs.prepare.outputs.needs_update == 'true' && needs.drift-plan.result == 'success' && needs.drift-plan.outputs.batch_count != '0'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.drift-plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    # Individual work is case-sharded. Keep a long hard ceiling so active shards are
    # not killed by the old 30-minute wall-clock limit; progress is emitted every
    # PRICE_DRIFT_CASE_BATCH_SIZE reachable cases.
    timeout-minutes: 360
    env:
      PRICE_DRIFT_CASE_BATCH_SIZE: '250'
      PRICE_DRIFT_WORKER_JSON: ${{ toJSON(matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: price-update-workspace
          path: .work/update
      - uses: actions/download-artifact@v4
        with:
          name: drift-plan
          path: .work/update
      - name: Classify drift worker ${{ matrix.worker_id }}
        run: node tools/drift-batch-run.js .work/update .work/update/drift-workers/worker-${{ matrix.worker_id }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: drift-worker-${{ matrix.worker_id }}
          path: .work/update/drift-workers/worker-${{ matrix.worker_id }}.json
          if-no-files-found: error

  drift-merge:
    needs: [prepare, drift-plan, drift]
    if: always() && needs.prepare.outputs.needs_update == 'true' && needs.drift-plan.result == 'success' && (needs.drift.result == 'success' || (needs.drift-plan.outputs.batch_count == '0' && needs.drift.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: drift-plan
          path: .work/update
      - uses: actions/download-artifact@v4
        if: needs.drift-plan.outputs.batch_count != '0'
        with:
          pattern: drift-worker-*
          path: .work/update/drift-batches
          merge-multiple: true
      - name: Merge drift classification batches
        run: node tools/merge-drift-batches.js .work/update/drift-plan.json .work/update/drift-batches .work/update/classify-change.json
      - uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: .work/update/classify-change.json
          if-no-files-found: error

  finalize:
    needs: [prepare, semantic-merge, golden, drift-merge]
    if: always() && needs.prepare.outputs.needs_update == 'true' && needs.semantic-merge.result == 'success' && needs.golden.result == 'success' && needs.drift-merge.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRICE_FINALIZE_PREVALIDATED: 'true'
    outputs:
      publishable: ${{ steps.finalize.outputs.publishable }}
      build_id: ${{ steps.finalize.outputs.build_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: price-update-workspace
          path: .work/update
      - uses: actions/download-artifact@v4
        with:
          name: semantic-report
          path: .work/update/reports
      - uses: actions/download-artifact@v4
        with:
          name: golden-report
          path: .work/update/reports
      - uses: actions/download-artifact@v4
        with:
          name: drift-report
          path: .work/update/reports
      - name: Finalize prevalidated immutable build
        id: finalize
        run: node tools/price-update-matrix.js finalize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-analysis
          path: .work/update/reports
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: steps.finalize.outputs.publishable == 'true'
        with:
          name: validated-price-candidate
          path: |
            .work/update/staged
            .work/update/reports
          include-hidden-files: true

  publish:
    needs: finalize
    if: needs.finalize.outputs.publishable == 'true' && inputs.validation_only != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      # Use the same source revision as the candidate validation. A concurrent
      # main update must cause the final push to fail closed rather than
      # validating an earlier candidate against a different semantic contract.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: validated-price-candidate
          path: .work/update
      - name: Verify proof, retain current + previous, promote manifest
        run: node tools/publish-price-build.js
      - run: npm run validate
      - name: Commit and push validated publication
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pricing/generated services/catalog.json tests/fixtures/aws
          if git diff --cached --quiet; then
            echo 'Price DB already published: no changes to commit'
          else
            git commit -m 'Publish validated AWS Price DB build'
            git push origin HEAD:main
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.publish.outputs.commit }}
