name: Scheduled Price Update
on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'pricing/normalization/**'
      - 'pricing/limitations.json'
      - 'pricing/sources.json'
      - 'src/pricing/**'
      - 'tools/pricing-cli/**'
      - 'tools/price-update.js'
      - 'tools/price-update-matrix.js'
      - 'tools/semantic-batch-plan.js'
      - 'tools/merge-semantic-batches.js'
      - 'tools/drift-batch-plan.js'
      - 'tools/drift-batch-run.js'
      - 'tools/merge-drift-batches.js'
      - '.github/workflows/price-update.yml'
  schedule:
    - cron: '23 2 * * *'
  # Also dispatched explicitly by onboarding-promotion because GITHUB_TOKEN pushes do not chain workflows.
  workflow_dispatch:
    inputs:
      validation_scope_service_ids:
        description: 'Comma-separated internal service ids for onboarding-scoped heavy validation. Empty means full validation.'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: pricing-update
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      PRICE_UPDATE_SCOPE_SERVICE_IDS: ${{ inputs.validation_scope_service_ids || '' }}
    outputs:
      needs_update: ${{ steps.prepare.outputs.needs_update }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Prepare normalized immutable candidate
        id: prepare
        run: node tools/price-update-matrix.js prepare
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.needs_update == 'true'
        with:
          name: price-update-workspace
          path: |
            .work/update/candidate
            .work/update/golden-raw
            .work/update/reports
            .work/update/source-metadata.json
            .work/update/prepare-state.json
          include-hidden-files: true
          compression-level: 1
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.needs_update != 'true'
        with:
          name: price-analysis
          path: .work/update/reports
          include-hidden-files: true

  semantic-plan:
    needs: prepare
    if: needs.prepare.outputs.needs_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      batch_count: ${{ steps.plan.outputs.batch_count }}
    env:
      PRICE_VALIDATE_PLAN_CONCURRENCY: '2'
      PRICE_VALIDATE_WORKFLOW_BATCH_CASES: '25000'
      PRICE_VALIDATE_MAX_WORKFLOW_BATCHES: '240'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: price-update-workspace
          path: .work/update
      - name: Plan semantic workflow batches
        id: plan
        shell: bash
        run: |
          node tools/semantic-batch-plan.js .work/update/candidate .work/update/semantic-plan.json
          node --input-type=module - <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile } from 'node:fs/promises';
          const plan = JSON.parse(await readFile('.work/update/semantic-plan.json', 'utf8'));
          console.log(`matrix=${JSON.stringify(plan.matrix)}`);
          console.log(`batch_count=${plan.summary.batches}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-plan
          path: .work/update/semantic-plan.json
          if-no-files-found: error

  semantic:
    needs: [prepare, semantic-plan]
    if: needs.prepare.outputs.needs_update == 'true' && needs.semantic-plan.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.semantic-plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRICE_VALIDATE_CONCURRENCY: '1'
      PRICE_VALIDATE_TASK_TIMEOUT_MS: '600000'
      PRICE_VALIDATE_HEARTBEAT_MS: '30000'
      PRICE_VALIDATE_BATCH_JSON: ${{ toJSON(matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: price-update-workspace
          path: .work/update
      - name: Validate semantic batch ${{ matrix.batch_id }}
        shell: bash
        run: |
          set +e
          node tools/pricing-cli/cli.js validate-price-data \
            --input .work/update/candidate \
            --output .work/update/batches/batch-${{ matrix.batch_id }}.json
          rc=$?
          if [[ $rc -eq 2 ]]; then
            exit 2
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-batch-${{ matrix.batch_id }}
          path: .work/update/batches/batch-${{ matrix.batch_id }}.json
          if-no-files-found: error

  semantic-merge:
    needs: [prepare, semantic-plan, semantic]
    if: always() && needs.prepare.outputs.needs_update == 'true' && needs.semantic-plan.result == 'success' && needs.semantic.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: semantic-plan
          path: .work/update
      - uses: actions/download-artifact@v4
        with:
          pattern: semantic-batch-*
          path: .work/update/batches
          merge-multiple: true
      - name: Merge semantic validation batches
        run: node tools/merge-semantic-batches.js .work/update/semantic-plan.json .work/update/batches .work/update/validate-price-data.json
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-report
          path: .work/update/validate-price-data.json
          if-no-files-found: error

  golden:
    needs: prepare
    if: needs.prepare.outputs.needs_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: price-update-workspace
          path: .work/update
      - name: Run golden validation independently
        shell: bash
        run: |
          set +e
          node tools/pricing-cli/cli.js run-golden \
            --input .work/update/candidate \
            --raw .work/update/golden-raw \
            --output .work/update/run-golden.json
          rc=$?
          if [[ $rc -eq 2 ]]; then
            exit 2
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: golden-report
          path: .work/update/run-golden.json
          if-no-files-found: error

  drift-plan:
    needs: [prepare, semantic-merge]
    if: needs.prepare.outputs.needs_update == 'true' && needs.semantic-merge.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      batch_count: ${{ steps.plan.outputs.batch_count }}
    env:
      PRICE_DRIFT_PLAN_CONCURRENCY: '2'
      PRICE_DRIFT_WORKFLOW_BATCH_CASES: '10000'
      PRICE_DRIFT_MAX_WORKFLOW_BATCHES: '240'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: price-update-workspace
          path: .work/update
      - uses: actions/download-artifact@v4
        with:
          name: semantic-report
          path: .work/update/reports
      - name: Plan drift workflow batches
        id: plan
        shell: bash
        run: |
          node tools/drift-batch-plan.js .work/update .work/update/drift-plan.json
          node --input-type=module - <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile } from 'node:fs/promises';
          const plan = JSON.parse(await readFile('.work/update/drift-plan.json', 'utf8'));
          console.log(`matrix=${JSON.stringify(plan.matrix)}`);
          console.log(`batch_count=${plan.summary.batches}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: drift-plan
          path: .work/update/drift-plan.json
          if-no-files-found: error

  drift:
    needs: [prepare, drift-plan]
    if: needs.prepare.outputs.needs_update == 'true' && needs.drift-plan.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.drift-plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    # Individual work is case-sharded. Keep a long hard ceiling so active shards are
    # not killed by the old 30-minute wall-clock limit; progress is emitted every
    # PRICE_DRIFT_CASE_BATCH_SIZE reachable cases.
    timeout-minutes: 360
    env:
      PRICE_DRIFT_CASE_BATCH_SIZE: '250'
      PRICE_DRIFT_BATCH_JSON: ${{ toJSON(matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: price-update-workspace
          path: .work/update
      - uses: actions/download-artifact@v4
        with:
          name: drift-plan
          path: .work/update
      - name: Classify drift batch ${{ matrix.batch_id }}
        run: node tools/drift-batch-run.js .work/update .work/update/drift-batches/batch-${{ matrix.batch_id }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: drift-batch-${{ matrix.batch_id }}
          path: .work/update/drift-batches/batch-${{ matrix.batch_id }}.json
          if-no-files-found: error

  drift-merge:
    needs: [prepare, drift-plan, drift]
    if: always() && needs.prepare.outputs.needs_update == 'true' && needs.drift-plan.result == 'success' && needs.drift.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: drift-plan
          path: .work/update
      - uses: actions/download-artifact@v4
        with:
          pattern: drift-batch-*
          path: .work/update/drift-batches
          merge-multiple: true
      - name: Merge drift classification batches
        run: node tools/merge-drift-batches.js .work/update/drift-plan.json .work/update/drift-batches .work/update/classify-change.json
      - uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: .work/update/classify-change.json
          if-no-files-found: error

  finalize:
    needs: [prepare, semantic-merge, golden, drift-merge]
    if: always() && needs.prepare.outputs.needs_update == 'true' && needs.semantic-merge.result == 'success' && needs.golden.result == 'success' && needs.drift-merge.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRICE_FINALIZE_PREVALIDATED: 'true'
    outputs:
      publishable: ${{ steps.finalize.outputs.publishable }}
      build_id: ${{ steps.finalize.outputs.build_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: price-update-workspace
          path: .work/update
      - uses: actions/download-artifact@v4
        with:
          name: semantic-report
          path: .work/update/reports
      - uses: actions/download-artifact@v4
        with:
          name: golden-report
          path: .work/update/reports
      - uses: actions/download-artifact@v4
        with:
          name: drift-report
          path: .work/update/reports
      - name: Finalize prevalidated immutable build
        id: finalize
        run: node tools/price-update-matrix.js finalize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-analysis
          path: .work/update/reports
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: steps.finalize.outputs.publishable == 'true'
        with:
          name: validated-price-candidate
          path: |
            .work/update/staged
            .work/update/reports
          include-hidden-files: true

  publish:
    needs: finalize
    if: needs.finalize.outputs.publishable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: validated-price-candidate
          path: .work/update
      - name: Verify proof, retain current + previous, promote manifest
        run: node tools/publish-price-build.js
      - run: npm run validate
      - name: Commit and push validated publication
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pricing/generated services/catalog.json tests/fixtures/aws
          git commit -m 'Publish validated AWS Price DB build'
          git push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.publish.outputs.commit }}
