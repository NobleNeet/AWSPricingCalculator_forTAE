name: Scheduled Price Update
on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'pricing/normalization/**'
      - 'pricing/limitations.json'
      - 'pricing/sources.json'
      - 'src/pricing/**'
      - 'tools/pricing-cli/**'
      - 'tools/price-update.js'
      - 'tools/price-update-matrix.js'
      - 'tools/merge-semantic-shards.js'
      - '.github/workflows/price-update.yml'
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pricing-update
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      needs_update: ${{ steps.prepare.outputs.needs_update }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Prepare normalized immutable candidate
        id: prepare
        run: node tools/price-update-matrix.js prepare
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.needs_update == 'true'
        with:
          name: price-update-workspace
          path: |
            .work/update/candidate
            .work/update/golden-raw
            .work/update/reports
            .work/update/source-metadata.json
            .work/update/prepare-state.json
          include-hidden-files: true
          compression-level: 1
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.needs_update != 'true'
        with:
          name: price-analysis
          path: .work/update/reports
          include-hidden-files: true

  semantic:
    needs: prepare
    if: needs.prepare.outputs.needs_update == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRICE_VALIDATE_CONCURRENCY: '2'
      PRICE_VALIDATE_TASK_TIMEOUT_MS: '600000'
      PRICE_VALIDATE_HEARTBEAT_MS: '30000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: price-update-workspace
          path: .work/update
      - name: Validate semantic shard ${{ matrix.shard }}
        shell: bash
        run: |
          set +e
          PRICE_VALIDATE_SHARD_INDEX=${{ matrix.shard }} \
          PRICE_VALIDATE_SHARD_COUNT=4 \
          node tools/pricing-cli/cli.js validate-price-data \
            --input .work/update/candidate \
            --output .work/update/shards/shard-${{ matrix.shard }}.json
          rc=$?
          if [[ $rc -eq 2 ]]; then
            exit 2
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-shard-${{ matrix.shard }}
          path: .work/update/shards/shard-${{ matrix.shard }}.json
          if-no-files-found: error

  finalize:
    needs: [prepare, semantic]
    if: always() && needs.prepare.outputs.needs_update == 'true' && needs.semantic.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRICE_VALIDATE_CONCURRENCY: '2'
      PRICE_DRIFT_TASK_TIMEOUT_MS: '600000'
      PRICE_DRIFT_HEARTBEAT_MS: '30000'
    outputs:
      publishable: ${{ steps.finalize.outputs.publishable }}
      build_id: ${{ steps.finalize.outputs.build_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: price-update-workspace
          path: .work/update
      - uses: actions/download-artifact@v4
        with:
          pattern: semantic-shard-*
          path: .work/update/shards
          merge-multiple: true
      - name: Merge semantic validation shards
        run: node tools/merge-semantic-shards.js .work/update/shards .work/update/reports/validate-price-data.json 4
      - name: Finalize validated immutable build
        id: finalize
        run: node tools/price-update-matrix.js finalize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-analysis
          path: .work/update/reports
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: steps.finalize.outputs.publishable == 'true'
        with:
          name: validated-price-candidate
          path: |
            .work/update/staged
            .work/update/reports
          include-hidden-files: true

  publish:
    needs: finalize
    if: needs.finalize.outputs.publishable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: validated-price-candidate
          path: .work/update
      - name: Verify proof, retain current + previous, promote manifest
        run: node tools/publish-price-build.js
      - run: npm run validate
      - name: Commit and push validated publication
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pricing/generated services/catalog.json tests/fixtures/aws
          git commit -m 'Publish validated AWS Price DB build'
          git push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.publish.outputs.commit }}
