name: ACM Price Probe

on:
  push:
    branches:
      - onboard/certificate-manager

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current AWS Certificate Manager price list
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 \
            https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AWSCertificateManager/current/index.json \
            -o /tmp/acm.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/acm.json').read_text())
          print('offerCode=', data.get('offerCode'))
          print('version=', data.get('version'))
          print('publicationDate=', data.get('publicationDate'))

          products = data.get('products', {})
          terms = data.get('terms', {}).get('OnDemand', {})
          print('totalProducts=', len(products))
          for sku, product in products.items():
              attrs = product.get('attributes', {})
              print('\nPRODUCT', sku)
              print(json.dumps(product, ensure_ascii=False, sort_keys=True))
              for term_code, term in terms.get(sku, {}).items():
                  print('TERM', term_code)
                  for rate, dim in term.get('priceDimensions', {}).items():
                      print(json.dumps(dim, ensure_ascii=False, sort_keys=True))
          PY
