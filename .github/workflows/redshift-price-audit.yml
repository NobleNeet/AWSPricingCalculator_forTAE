name: Redshift Price List Audit
on:
  push:
    branches: [onboard/redshift]
    paths:
      - 'tools/redshift-offer-audit.mjs'
      - '.github/workflows/redshift-price-audit.yml'
  workflow_dispatch:
jobs:
  redshift-price-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download actual AWS regional offer and group rate evidence
        run: node tools/redshift-offer-audit.mjs ap-northeast-1 redshift-offer-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redshift-tokyo-pricing-evidence
          path: redshift-offer-audit.json
          if-no-files-found: warn
