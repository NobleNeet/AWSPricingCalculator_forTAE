name: Deploy AWS estimator to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Check published Price DB matches Definitions
        id: readiness
        run: node tools/pages-readiness.js

      - name: Explain deferred deployment
        if: steps.readiness.outputs.ready != 'true'
        run: echo 'Pages deployment deferred; Scheduled Price Update will deploy after publishing a matching validated Price DB.'

      - run: npm run build:site
        if: steps.readiness.outputs.ready == 'true'

      - name: Setup Pages
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/configure-pages@v5

      - name: Upload static production estimator
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.work/site

      - name: Deploy to GitHub Pages
        if: steps.readiness.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
