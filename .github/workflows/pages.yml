name: Deploy AWS estimator to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run validate
      - run: npm run build:site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static production estimator
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.work/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
