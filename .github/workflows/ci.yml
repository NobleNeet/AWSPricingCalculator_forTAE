name: Application and Definition CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate active build or temporary Definition candidate
        run: node tools/ci-validate.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build:site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-e2e-report
          path: playwright-report
