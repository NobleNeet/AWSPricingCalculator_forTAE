name: Application and Definition CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: application-definition-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    # Pull requests already validate GitHub's synthetic merge result. After that
    # result is merged, rerunning the same full suite on the merge commit is
    # redundant. Keep push validation for direct human pushes to main/branches,
    # while bot-generated publication/promotion commits are validated by their
    # producing workflows before they are pushed.
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'push' &&
        github.actor != 'github-actions[bot]' &&
        !startsWith(github.event.head_commit.message, 'Merge pull request #')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate active build or temporary Definition candidate
        run: node tools/ci-validate.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build:site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-e2e-report
          path: playwright-report
