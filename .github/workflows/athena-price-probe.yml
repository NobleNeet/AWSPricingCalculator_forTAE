name: Temporary Athena Price List Probe
on:
  pull_request:
    paths:
      - 'services/athena/**'
      - '.github/workflows/athena-price-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect real AmazonAthena price list
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          u='https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonAthena/current/ap-northeast-1/index.json'
          with urllib.request.urlopen(u,timeout=90) as response:
              offer=json.load(response)
          print('publicationDate:',offer.get('publicationDate'),'version:',offer.get('version'))
          print('products:',len(offer.get('products',{})))
          for sku, product in sorted(offer.get('products',{}).items()):
              terms=offer.get('terms',{}).get('OnDemand',{}).get(sku,{})
              ds=[]
              for term in terms.values():
                  for code,dim in term.get('priceDimensions',{}).items():
                      ds.append(dict(unit=dim.get('unit'),description=dim.get('description'),beginRange=dim.get('beginRange'),endRange=dim.get('endRange'),usd=dim.get('pricePerUnit',{}).get('USD')))
              print(json.dumps(dict(sku=sku,family=product.get('productFamily'),attributes=product.get('attributes'),dimensions=ds),ensure_ascii=False,sort_keys=True))
          PY
