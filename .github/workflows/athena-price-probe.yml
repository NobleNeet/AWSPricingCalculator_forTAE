name: Temporary Athena Price List Probe
on:
  pull_request:
    paths:
      - 'services/athena/**'
      - '.github/workflows/athena-price-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Athena across all supported regions
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          for region in ('ap-northeast-1', 'ap-northeast-3', 'us-east-1', 'us-east-2', 'us-west-1', 'us-west-2'):
              url = 'https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonAthena/current/' + region + '/index.json'
              with urllib.request.urlopen(url, timeout=90) as response:
                  offer = json.load(response)
              print('REGION', region, 'COUNT', len(offer['products']))
              for sku, product in sorted(offer['products'].items()):
                  print('PRODUCT', json.dumps({'sku': sku, 'family': product.get('productFamily'), 'attributes': product.get('attributes')}, sort_keys=True))
                  for term in offer['terms']['OnDemand'].get(sku, {}).values():
                      for dimension in term['priceDimensions'].values():
                          print('DIMENSION', json.dumps({'unit': dimension['unit'], 'price': dimension['pricePerUnit']['USD']}, sort_keys=True))
          PY
