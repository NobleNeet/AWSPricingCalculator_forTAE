name: Temporary KMS Price List Inspection

on:
  push:
    branches:
      - onboard/kms
    paths:
      - .github/workflows/kms-price-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download KMS offer
        run: |
          curl -fsSL --retry 5 --retry-delay 2             https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/awskms/current/index.json             -o /tmp/kms.json

      - name: Print Tokyo KMS products and dimensions
        run: |
          jq -r '
            . as $root
            | .products
            | to_entries[]
            | select(
                (.value.attributes.regionCode // "") == "ap-northeast-1"
                or (.value.attributes.location // "") == "Asia Pacific (Tokyo)"
              )
            | .key as $sku
            | {
                sku: $sku,
                productFamily: .value.productFamily,
                attributes: .value.attributes,
                onDemand: (
                  ($root.terms.OnDemand[$sku] // {})
                  | to_entries
                  | map(
                      .value.priceDimensions
                      | to_entries
                      | map({
                          rateCode: .key,
                          unit: .value.unit,
                          beginRange: .value.beginRange,
                          endRange: .value.endRange,
                          description: .value.description,
                          pricePerUnit: .value.pricePerUnit
                        })
                    )
                  | add
                )
              }
            | @json
          ' /tmp/kms.json
